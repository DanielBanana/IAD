# This is a product file that contains every information to inference a anomaly detection model for a irlbacher product
# like the MDF6
# Usually this is the result of a training run, after which a model can be used to detect anomalies
# This file mainly contains references to other setting files that are queried by the program that uses this file.

product: "fabric_03"

logging:
  logFileName: "general.log"

model:
  name: "InpFormer"
  config: InpFormer.yaml
  # weights_path/trainingDir pin an exact prior run. Omit both (as here) to have
  # them resolved automatically from results/ at load time, picking the run
  # per `selection`: "latest" (newest complete run) or "best" (highest
  # image_F1Score among complete runs, read from each run's metric_results.csv).
  selection: "best"

tiling:
  enable: True
  config: "TiledEnsembleAITEX.yaml"

trainer:
  config: "Training_Inpformer.yaml"

inferencer:
  config: "Inference.yaml"

dataset:
  name: "AITEX_"
  category: "fabric_03"
  split:
    - "train"
    - "test"