# Model configuration
model: "patchcore" # For referencing in logs, saved models, etc.
backbone: "resnet18"  # Available options: resnet18, wide_resnet50_2, etc.
layers: ["layer2", "layer3"] # Names of layers to extract features from. Defaults is ("layer2", "layer3").
pre_trained: true # Whether to use pre-trained backbone weights. Defaults is True.
coreset_sampling_ratio: 0.1 # Ratio for coreset sampling to subsample embeddings. Defaults is 0.1.
num_neighbors: 9 # Number of nearest neighbors to use. Defaults is 9.

# Non-primitive types: reference other YAML files
pre_processor: "configs/PreProcessor.yaml"  # or set to false to disable
post_processor: "configs/PostProcessor.yaml"  # or set to false to disable
evaluator: "configs/Evaluator.yaml"  # or set to false to disable
