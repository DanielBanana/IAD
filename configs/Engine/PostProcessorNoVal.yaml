enable_normalization: False # Only available with a validation set
enable_threshold_matching: True # Use pixel level threshold for image level if image threshold not available and vice versa
enable_thresholding: False # Only available with a validation set
image_sensitivity: 0.1 # Value between 0 and 1: Should be tuned to the application. Higher sensitivity lowers the effective threshold.
pixel_sensitivity: 0.1
gt_mask: False
