version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: '%(levelname)s: %(message)s'
  detailed:
    format: '[%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s'
    datefmt: '%Y-%m-%dT%H:%M:%S%z'
handlers:
  stdout:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  stderr:
    class: logging.StreamHandler
    level: WARNING
    formatter: simple
    stream: ext://sys.stderr
  infoFile:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: info.log
    maxBytes: 10000000
    backupCount: 3
    encoding: utf-8
  debugFile:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: debug.log
    maxBytes: 10000000
    backupCount: 3
    encoding: utf-8
loggers:
  root:
    level: DEBUG
    handlers:
    - stderr
    - stdout
    - debugFile
    - infoFile
  # logger:  # This is the MongoDB logger
  #   level: DEBUG
  #   handlers:
  #   - mongodb
  #   propagate: False
    